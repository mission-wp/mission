# Updates only the wp.org listing — banners, icon, screenshots (from
# `.wordpress-org/`) and `trunk/readme.txt` (description, tags, FAQ,
# changelog). Does NOT touch plugin code, does NOT create an SVN tag,
# does NOT trigger a "new version available" prompt for installed users.
#
# Run from Actions → "Update WordPress.org listing" → Run workflow.

name: Update WordPress.org listing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update wp.org assets and readme
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: mission-donation-platform
          IGNORE_OTHER_FILES: true

      # wp.org parses the listing page (description, tags, FAQ, changelog)
      # from tags/<Stable Tag>/readme.txt, not trunk. The asset-update action
      # above only writes trunk when IGNORE_OTHER_FILES is set, so copy the
      # readme into the current stable tag as well.
      - name: Sync readme into the current stable tag
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: mission-donation-platform
        run: |
          set -euo pipefail

          STABLE_TAG=$(grep -oP '(?i)^Stable Tag:\s*\K\S+' readme.txt)
          if [ -z "$STABLE_TAG" ] || [ "$STABLE_TAG" = "trunk" ]; then
            echo "Stable Tag missing or set to trunk — no tag readme to sync."
            exit 0
          fi

          SVN_OPTS="--username $SVN_USERNAME --password $SVN_PASSWORD --non-interactive --no-auth-cache"
          svn co --depth=files "https://plugins.svn.wordpress.org/${SLUG}/tags/${STABLE_TAG}" svn-tag $SVN_OPTS

          cp readme.txt svn-tag/readme.txt
          cd svn-tag
          if [ -n "$(svn diff readme.txt)" ]; then
            svn ci -m "Sync tag readme with trunk" $SVN_OPTS
          else
            echo "Tag readme already matches trunk — nothing to commit."
          fi
